<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GigBoard — My Orders & Bookings</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2245%22 fill=%22%234F46E5%22/><text y=%2265%22 x=%2250%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22white%22>📦</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav" id="nav"></nav>

<main>
  <div class="wrap">
    
    <div class="page-head" style="margin-bottom:28px;">
      <span class="campus-tag-nav" style="margin-left:0; margin-bottom:8px; display:inline-block;">Client Hub</span>
      <h1 style="font-size:2.2rem; margin-bottom:6px;">My Orders & Bookings</h1>
      <p>Track the progress of your requests sent to student creators across Indian college campuses.</p>
    </div>

    <!-- Identity Gate -->
    <div class="card" id="identityCard" style="max-width:520px; margin:0 auto 36px; text-align:center;">
      <h3 style="font-size:1.25rem; margin-bottom:8px;">Find Your Orders</h3>
      <p style="margin-bottom:18px; font-size:0.9rem;">Enter the email address you used when requesting the service.</p>

      <div class="field" style="text-align:left;">
        <label for="emailInput">Your Email Address</label>
        <input type="email" id="emailInput" placeholder="e.g. rohan@campus.ac.in or you@gmail.com">
      </div>

      <button class="btn btn-primary btn-full" id="loadBookingsBtn">View My Orders</button>

      <!-- Quick Account Switcher -->
      <div style="margin-top:16px; padding:10px 14px; background:#F8FAFC; border-radius:8px; border:1px solid #E2E8F0; text-align:left;">
        <div style="font-size:0.75rem; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">Quick Switch Client:</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button type="button" onclick="loadClientEmail('test@client.com')" class="btn btn-ghost btn-sm" style="padding:4px 10px; font-size:0.82rem;">
            test@client.com
          </button>
          <button type="button" onclick="loadClientEmail('rohan@campus.ac.in')" class="btn btn-ghost btn-sm" style="padding:4px 10px; font-size:0.82rem;">
            rohan@campus.ac.in
          </button>
        </div>
      </div>
    </div>

    <!-- Bookings Results Container -->
    <div id="bookingsContent" style="display:none; max-width:820px; margin:0 auto;"></div>

  </div>
</main>

<div id="toastContainer" class="toast-container"></div>
<footer id="footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!requireAuth()) return;
  renderNav("my-bookings.html");
  renderFooter();

  const user = getCurrentUser();
  const presetEmail = new URLSearchParams(location.search).get("email");
  const lastSavedEmail = localStorage.getItem("gb_last_client_email");

  if (presetEmail) {
    document.getElementById("emailInput").value = presetEmail;
    loadBookings(presetEmail);
  } else if (user) {
    document.getElementById("emailInput").value = user.email;
    loadBookings(user.email);
  } else if (lastSavedEmail) {
    document.getElementById("emailInput").value = lastSavedEmail;
    loadBookings(lastSavedEmail);
  }

  document.getElementById("loadBookingsBtn").addEventListener("click", () => {
    const email = document.getElementById("emailInput").value.trim();
    if (email) loadBookings(email);
  });

  document.getElementById("emailInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      const email = document.getElementById("emailInput").value.trim();
      if (email) loadBookings(email);
    }
  });
});

function loadClientEmail(email) {
  document.getElementById("emailInput").value = email;
  loadBookings(email);
}

function loadDemoBuyer() {
  loadClientEmail("rohan@campus.ac.in");
}

function loadBookings(email) {
  const content = document.getElementById("bookingsContent");
  const identityCard = document.getElementById("identityCard");
  const cleanEmail = email.trim();
  if (!cleanEmail) return;

  localStorage.setItem("gb_last_client_email", cleanEmail);

  const bookings = getBookingsByEmail(cleanEmail).sort((a, b) => b.createdAt - a.createdAt);

  identityCard.style.display = "none";
  content.style.display = "block";

  if (bookings.length === 0) {
    content.innerHTML = `
      <div class="empty">
        <h3>No orders found for "${escapeHtml(cleanEmail)}"</h3>
        <p>Haven't booked a creator yet? <a href="index.html" style="color:var(--primary); font-weight:700;">Explore student gigs</a>.</p>
        <button onclick="changeClientEmail()" class="btn btn-ghost btn-sm" style="margin-top:14px;">Try another email</button>
      </div>`;
    return;
  }

  content.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
      <div>
        <span style="font-size:0.86rem; color:var(--text-muted);">Orders placed by</span>
        <h2 style="font-size:1.35rem; margin:2px 0 0 0;">${escapeHtml(cleanEmail)}</h2>
      </div>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <button onclick="loadClientEmail('test@client.com')" class="btn btn-ghost btn-sm" style="color:var(--coral); font-weight:600;">
          Sample: test@client.com
        </button>
        <button onclick="changeClientEmail()" class="btn btn-ghost btn-sm">Switch Email</button>
      </div>
    </div>

    ${bookings.map(b => {
      const gig = getGigById(b.gigId);
      const campus = (gig && gig.collegeCampus) || "Indian Campus";
      let statusDetail = "";

      if (b.status === "Declined") {
        statusDetail = `
          <div class="notes" style="border-left:3px solid var(--coral); background:#FFF5F3; padding:12px 14px; border-radius:6px; margin-top:14px;">
            <div style="font-weight:700; color:var(--coral); font-size:0.84rem; margin-bottom:4px;">
              Reason from Creator:
            </div>
            <div style="font-size:0.92rem; color:var(--ink); line-height:1.4;">
              "${b.declineReason ? escapeHtml(b.declineReason) : "Fully booked that week due to semester exams & campus fest projects."}"
            </div>
          </div>
          <!-- Alternatives & Re-request -->
          <div class="actions" style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap;">
            ${gig ? `<a class="btn btn-primary btn-sm" href="book.html?gig=${gig.id}&rebook=${b.id}">Request again</a>` : ""}
            ${gig ? `<a class="btn btn-ghost btn-sm" href="index.html?cat=${encodeURIComponent(gig.category)}">Browse similar gigs</a>` : `<a class="btn btn-ghost btn-sm" href="index.html">Browse similar gigs</a>`}
          </div>
        `;
      } else if (b.status === "Pending") {
        statusDetail = `
          <div style="margin-top:12px; font-size:0.88rem; color:var(--text-muted); display:flex; align-items:center; gap:6px;">
            <span>⏳</span> Waiting for <strong>${escapeHtml(b.gigCreatorName)}</strong> to accept your request.
          </div>
        `;
      } else if (b.status === "Accepted") {
        statusDetail = `
          <div style="margin-top:12px; padding:12px; background:var(--emerald-light); border-radius:var(--radius-sm); font-size:0.88rem; color:#065F46;">
            <strong>✓ Order Confirmed!</strong> ${escapeHtml(b.gigCreatorName)} is working on your deliverable for <strong>${fmtDate(new Date(b.date).getTime())}</strong>.
          </div>
        `;
      } else if (b.status === "Completed") {
        statusDetail = `
          <div style="margin-top:12px; padding:12px; background:#EEF2FF; border-radius:var(--radius-sm); font-size:0.88rem; color:#3730A3;">
            <strong>🎉 Delivered & Completed!</strong> Thank you for supporting student creators.
          </div>
        `;
      }

      const amount = b.totalAmount || (b.baseRate ? (b.baseRate + Math.max(1, Math.round(b.baseRate * 0.03))) : (gig ? gig.rate : 0));
      const fee = b.platformFee || Math.max(1, Math.round((b.baseRate || (gig ? gig.rate : 0)) * 0.03));

      return `
        <div class="booking-row">
          <div class="top">
            <div>
              <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
                <h3>${escapeHtml(b.gigTitle)}</h3>
                <span class="campus-chip" style="font-size:0.7rem; padding:2px 8px;">🎓 ${escapeHtml(campus)}</span>
              </div>
              <div class="meta">
                Creator: <strong>${escapeHtml(b.gigCreatorName)}</strong> &middot; 
                Delivery Target: <strong>${fmtDate(new Date(b.date).getTime())}</strong>
              </div>
              <div style="font-size:0.85rem; color:var(--ink-soft); margin-top:4px;">
                Total: <strong>₹${amount}</strong> (Includes ₹${fee} 3% Campus Platform Fee)
              </div>
            </div>
            <span class="status-pill status-${b.status}">${b.status}</span>
          </div>

          ${b.notes ? `<div class="notes"><strong>Your Notes:</strong> ${escapeHtml(b.notes)}</div>` : ''}
          ${statusDetail}
        </div>
      `;
    }).join("")}
  `;
}

function changeClientEmail() {
  document.getElementById("identityCard").style.display = "block";
  document.getElementById("bookingsContent").style.display = "none";
}
</script>
</body>
</html>
